<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS Phones — Property Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand"><span class="dot"></span> SOS Phones</span>
    <span class="spacer"></span>
    <span id="whoHost"></span>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>

  <div class="searchrow">
    <select id="field" class="fieldsel" aria-label="Search by">
      <option value="all">All fields</option>
      <option value="property">Property address</option>
      <option value="name">Owner name</option>
      <option value="mailing">Mailing address</option>
      <option value="folio">FOLIO</option>
    </select>
    <div class="searchbar">
      <span class="icon">&#128269;</span>
      <input type="search" id="q" autocomplete="off" autofocus>
    </div>
  </div>
  <p class="hint" id="hint"></p>

  <div id="status" class="empty">Start typing to search 285,947 properties.</div>
  <div id="results" class="results"></div>
  <div id="more" style="margin-top:14px"></div>
</main>

<script src="config.js"></script>
<script type="module" src="assets/search.js"></script>
</body>
</html>
