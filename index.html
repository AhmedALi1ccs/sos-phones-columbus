<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS Phones — Property Search</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand"><span class="dot"></span> SOS Phones</span>
    <span class="spacer"></span>
    <span id="whoHost"></span>
  </div>
</header>

<div class="shell wrap">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
  <div id="banner"></div>

  <div class="searchrow">
    <select id="field" class="fieldsel" aria-label="Search by">
      <option value="all">All fields</option>
      <option value="property">Property address</option>
      <option value="name">Owner name</option>
      <option value="mailing">Mailing address</option>
      <option value="parcel">Parcel Number</option>
    </select>
    <span class="divider"></span>
    <span class="icon">&#128269;</span>
    <input type="search" id="q" autocomplete="off" autofocus>
  </div>
  <p class="hint" id="hint"></p>

  <section class="card filters" id="filters">
    <div class="filters-head">
      <h2>Filter by distress</h2>
      <span class="filters-count" id="filterCount"></span>
      <span class="spacer"></span>
      <button class="btn ghost" id="clearFilters" hidden>Clear</button>
      <button class="btn" id="exportBtn" disabled>Export CSV</button>
    </div>
    <div class="chips toggles" id="distressChips">
      <span class="hint">Loading distress reasons…</span>
    </div>
  </section>

  <div id="summary" class="summary"></div>
  <div id="status" class="empty"></div>
  <div id="results" class="results"></div>
  <nav id="pager" class="pager" aria-label="Pages"></nav>
</main>
</div>

<script src="config.js"></script>
<script type="module" src="assets/search.js"></script>
</body>
</html>
