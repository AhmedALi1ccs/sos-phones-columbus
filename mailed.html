<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS Phones — Mailing</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap wide">
    <span class="brand"><span class="dot"></span> SOS Phones</span>
    <span class="spacer"></span>
    <span id="whoHost"></span>
  </div>
</header>

<div class="shell wrap wide">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div id="banner"></div>
    <h1 class="addr">Mailing</h1>
    <p class="sub">Every record that has been mailed, newest first.</p>

    <section class="card panel filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <span class="filters-count" id="mailCount"></span>
        <span class="spacer"></span>
        <button class="btn ghost" id="clearFilters" hidden>Clear</button>
      </div>

      <div class="filter-grid">
        <label class="ffield">Vendor
          <select id="vendor"><option value="">Any vendor</option></select>
        </label>
        <label class="ffield">Mail distress
          <select id="distress"><option value="">Any distress</option></select>
        </label>
        <label class="ffield">Month
          <select id="period"><option value="">Any month</option></select>
        </label>
        <label class="ffield">Mailed from
          <input type="date" id="mailedFrom">
        </label>
        <label class="ffield">Mailed to
          <input type="date" id="mailedTo">
        </label>
        <label class="ffield grow">Search
          <input type="search" id="q" autocomplete="off" placeholder="address, owner, parcel number…">
        </label>
      </div>
      <p class="hint" id="mailInfo" style="margin:10px 0 0"></p>
    </section>

    <div id="summary" class="summary"></div>
    <div id="status" class="empty"></div>
    <div class="card" id="rows"></div>
    <nav id="pager" class="pager" aria-label="Pages"></nav>
  </main>
</div>

<script src="config.js"></script>
<script type="module" src="assets/mailed.js"></script>
</body>
</html>
