<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS Phones — Settings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <span class="brand"><span class="dot"></span> SOS Phones</span>
    <span class="spacer"></span>
    <span id="whoHost"></span>
  </div>
</header>

<div class="shell wrap">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
  <div id="banner"></div>
  <h1 class="addr">Settings</h1>
  <p class="sub">Records removed here are moved to <code>notBuybox</code>, not deleted, and can be put back.</p>

  <section class="card panel section" style="margin-top:20px">
    <h2>Remove from Buybox</h2>
    <p class="hint" style="margin:0 0 14px">
      Choose one field to match on, then enter a value. You will be shown how many
      records match before anything is moved.
    </p>

    <div class="removebar">
      <select id="field" class="fieldsel" aria-label="Match on">
        <option value="parcel">Parcel Number</option>
        <option value="address">Address</option>
        <option value="zip">Property zip</option>
      </select>
      <span class="divider"></span>
      <input type="text" id="value" autocomplete="off" placeholder="e.g. 010-000001-00">
      <button class="btn danger" id="removeBtn">Remove…</button>
    </div>
    <p class="hint" id="fieldHint" style="margin-top:10px"></p>
  </section>

  <section class="section">
    <h2>Recently removed</h2>
    <div class="card" id="removals">
      <div class="phone-row"><span class="hint">Loading…</span></div>
    </div>
  </section>
</main>
</div>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal card" role="alertdialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Are you sure?</h2>
    <p class="modal-count" id="modalCount"></p>
    <p id="modalBody"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn danger" id="confirmBtn">Yes, remove</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script type="module" src="assets/settings.js"></script>
</body>
</html>
